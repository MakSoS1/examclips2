services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: examclips
      POSTGRES_PASSWORD: examclips
      POSTGRES_DB: examclips
    volumes:
      - examclips-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examclips"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://examclips:examclips@db:5432/examclips
      CORS_ORIGINS: http://localhost
      GROQ_API_KEY: \${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  examclips-db:
